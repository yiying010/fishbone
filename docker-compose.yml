name: fishbone

# Docker's default json-file driver has no size limit, so every service below
# caps its logs. Unbounded container logs are one of the few ways this service
# can take a whole host down, and student IP addresses and room codes end up in
# them via the request log.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Deterministic collation so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    # Not published by default: only the app needs it. Uncomment to inspect the
    # database from the host during development.
    # ports:
    #   - "127.0.0.1:5432:5432"

  # One-shot: applies pending migrations, then exits. `app` waits for it to
  # succeed, so a broken migration stops the deploy at a container that is
  # plainly Exited(1) instead of putting the app into a crash loop whose real
  # cause is buried in restart logs.
  #
  # Safe to re-run and safe to run concurrently: runMigrations takes a Postgres
  # advisory lock and skips anything already in schema_migrations.
  migrate:
    build:
      context: .
      target: runtime
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Unused by migrations, but loadConfig validates the whole environment in
      # one pass and treats this as hard-required, so leaving it out fails the
      # migration with a message about retention.
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:?set DATA_RETENTION_DAYS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["node", "build/cli/migrate.js"]
    logging: *logging

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:?set DATA_RETENTION_DAYS in .env}
      RETENTION_SWEEP_INTERVAL_MINUTES: ${RETENTION_SWEEP_INTERVAL_MINUTES:-60}
      RETENTION_BULK_DELETE_PERCENT: ${RETENTION_BULK_DELETE_PERCENT:-25}
      RETENTION_BULK_DELETE_MINIMUM: ${RETENTION_BULK_DELETE_MINIMUM:-10}
      RETENTION_CONFIRM_BULK_DELETE: ${RETENTION_CONFIRM_BULK_DELETE:-false}
      SYNC_LONG_POLL_MS: ${SYNC_LONG_POLL_MS:-20000}
      # Off here because the `migrate` service above has already run and this
      # service does not start until it succeeded. The application default
      # stays true, so running the image outside compose still self-migrates.
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      # Bound to loopback: the public entry point is nginx on the host, which
      # terminates TLS and strips the /fishbone prefix before proxying here.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    logging: *logging
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.0}
    pids_limit: 256
    # Must exceed SYNC_LONG_POLL_MS. Fastify's close waits for in-flight
    # requests, and a held sync request can be 20s old; the 10s docker default
    # would SIGKILL them instead of letting them finish.
    stop_grace_period: 30s

volumes:
  db-data:
