# Example front-end nginx for https://creativity.rcsl.online/fishbone
#
# This is the layer that terminates TLS and strips the /fishbone prefix. The
# application is served at / inside its container and is never told what its
# public path is, so the same image works unchanged at any other prefix: copy
# this block, change /fishbone to the new prefix, done.
#
# Verified against nginx 1.27 with two proxy layers in front of the container.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name creativity.rcsl.online;

    # ssl_certificate     /etc/letsencrypt/live/creativity.rcsl.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/creativity.rcsl.online/privkey.pem;

    # Emit relative Location headers. Without this nginx rebuilds an absolute
    # URL from $host and can lose the scheme or port behind another proxy.
    absolute_redirect off;

    # Send /fishbone to /fishbone/ so relative URLs on the page resolve inside
    # the prefix rather than at the domain root.
    location = /fishbone { return 308 /fishbone/; }

    location /fishbone/ {
        # The trailing slash on proxy_pass is what strips the prefix.
        proxy_pass http://127.0.0.1:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Room sync is a held HTTP request, not a socket. This timeout must
        # exceed SYNC_LONG_POLL_MS (20s by default) or every sync request is
        # cut off at the proxy and the room falls back to reconnect loops.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Held responses must not sit in a buffer waiting to be filled.
        proxy_buffering off;

        # Snapshots for a large room can exceed the 1m default.
        client_max_body_size 8m;
    }

    # A second, unrelated project on the same domain. Nothing about the block
    # above has to change for this one to exist.
    # location = /other { return 308 /other/; }
    # location /other/ { proxy_pass http://127.0.0.1:3001/; ... }
}

server {
    listen 80;
    listen [::]:80;
    server_name creativity.rcsl.online;
    return 308 https://$host$request_uri;
}
