<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>魚骨洞天</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#162033;--muted:#667085;--line:#cbd5e1;--panel:#fff;--blue:#276ef1;--green:#00a676;--red:#d95d39;--gold:#f2b84b;--violet:#7b61ff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}
    button,input,select,textarea{font:inherit} button{border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;padding:10px 14px;cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
    button.secondary{background:#edf2f7;color:#253348} button.danger{background:#fff1f0;color:var(--red)} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)} textarea{min-height:84px;resize:vertical}
    h1,h2,h3,p{margin-top:0}.app{padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:12px}.top h1{margin:0;font-size:30px}.eyebrow{font-size:12px;font-weight:900;color:var(--red);margin-bottom:4px}.progress{min-width:250px}.track{height:10px;background:#e6edf3;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}.panel,.preview,.teacherCard{background:#fff;border:1px solid var(--line);border-radius:8px}.main{min-width:0}.preview{align-self:start;position:sticky;top:12px;padding:12px}.teacherCard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;margin-bottom:12px;padding:16px}.avatar{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--gold);font-weight:900}.teacherCard h2{font-size:21px;margin-bottom:7px}.teacherCard p{font-size:15px;line-height:1.55;color:#344054;margin-bottom:7px}.navBtns{display:flex;gap:8px;align-self:center}
    .panel{min-height:calc(100vh - 208px);padding:18px}.panelHead{border-bottom:1px solid #e3eaf1;margin-bottom:14px;padding-bottom:10px}.panelHead h2{font-size:24px;margin-bottom:5px}.hint,.small{font-size:13px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row.stack{align-items:stretch}.row.stack>*{flex:1}.cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.card,.mini,.drop,.surface,.connectDrop,.introBox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.card{display:grid;gap:9px}.mini{margin-top:8px;cursor:grab}.badge{display:inline-flex;border:1px solid;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;background:#fff;width:max-content}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.columns.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.drop{min-height:190px;background:#f8fafc;border-style:dashed}.add{display:grid;grid-template-columns:1fr auto;gap:8px;background:#f8fafc;border:1px solid #e3eaf1;border-radius:8px;padding:10px;margin-bottom:12px}.ok{background:#eaf7f1;color:#12623d;font-weight:800;border-radius:8px;padding:10px}.warn{color:var(--red);font-size:13px}.mutedBox{background:#f8fafc;border:1px solid #e3eaf1;border-radius:8px;padding:12px;margin-bottom:12px}
    .sourceEditor{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.dot{width:14px;height:14px;border-radius:50%}.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.mode button{min-height:70px}.selected{background:var(--green)!important;color:#fff!important}.choice{display:flex;gap:8px;align-items:center;text-align:left;background:#f8fafc;color:var(--ink);border:1px solid var(--line);margin-bottom:8px;width:100%;justify-content:flex-start}.choice.selected{border-color:var(--green);background:#eaf7f1;color:var(--ink)}
    .speakBox{background:#f8fafc;border:1px solid #e3eaf1;border-radius:8px;padding:12px;margin-bottom:14px}.speakBox label{display:block;font-weight:800;margin-bottom:6px}.speakControls{display:grid;grid-template-columns:minmax(160px,220px) auto auto;gap:8px;margin-top:8px}.voiceStatus{font-size:13px;color:var(--muted);margin-top:8px}.hiddenStatus{display:none}
    .fish{background:#fffdfa;border:1px solid #d8dee8;border-radius:8px;overflow:hidden;margin-bottom:12px}.head{background:#1f2a3d;color:#fff;padding:12px;display:grid;gap:4px}.head span{font-size:12px;color:#c6d4e7;font-weight:900}.bones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:12px}.bone{border-left:5px solid var(--gold);border-radius:8px;background:#f7f9fb;padding:10px}.bone h3{font-size:15px;margin-bottom:8px}.bone p{font-size:13px;line-height:1.5;color:#344054;margin-bottom:7px}.preview .fish{max-height:43vh;overflow:auto}.links span{display:inline-flex;background:#eaf1ff;color:var(--blue);border-radius:999px;font-size:12px;font-weight:800;padding:5px 8px;margin:4px}.outcome{background:#172033;color:#f8fafc;border-radius:8px;padding:16px;white-space:pre-wrap;line-height:1.65;max-height:460px;overflow:auto}
    .introDiagram{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:14px 0}.introStack{display:grid;gap:8px}.introBox{background:#f8fafc}.fishLine{height:4px;background:#1f2a3d;min-width:120px}.fishMiniHead{background:#1f2a3d;color:#fff;border-radius:999px;padding:12px 16px;font-weight:900;text-align:center}.arrow{font-size:28px;text-align:center}.connectDrop{border-style:dashed;margin-bottom:10px;min-height:94px}.methodCard{border-left:5px solid var(--blue)}.formal{border-left:5px solid var(--green)}.needs{border-left:5px solid var(--red)}
    .safety{position:fixed;inset:0;background:rgba(23,32,51,.76);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.safety.show{display:flex}.safetyPanel{background:#fff;border-radius:8px;padding:26px;max-width:640px}.safetyPanel h2{font-size:26px}.afterHelp{display:none;margin-top:12px}.afterHelp.show{display:block}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{display:inline-flex;align-items:center;gap:6px;background:#f2f6fa;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.chip input{width:auto}
    @media(max-width:1120px){.layout{grid-template-columns:1fr}.preview{position:static}.teacherCard{grid-template-columns:auto 1fr}.navBtns{grid-column:1/-1}}@media(max-width:760px){.app{padding:10px}.top,.columns.two,.introDiagram{display:grid;grid-template-columns:1fr}.row.stack,.speakControls{display:grid;grid-template-columns:1fr}.progress{min-width:0}.mode{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="safety" id="safety">
    <section class="safetyPanel">
      <p class="eyebrow">活動已暫停</p>
      <h2>這個內容可能涉及安全或需要成人協助</h2>
      <p>請立刻找現場老師或可信任成人協助。我們不會把這個內容當作魚骨圖練習素材，也不會繼續追問細節。</p>
      <button onclick="ackSafety()">我已找老師或可信任成人協助</button>
      <div class="afterHelp" id="afterHelp">
        <p class="small">如果老師或可信任成人已協助處理，而且你想繼續活動，請另開一個新的、安全的一般生活困擾。</p>
        <button class="secondary" onclick="resetAll()">重新開始一個安全題目</button>
      </div>
      <p class="small" id="safetyMeta"></p>
    </section>
  </div>
  <main class="app">
    <header class="top">
      <div><p class="eyebrow">創意萬事通</p><h1>魚骨洞天</h1></div>
      <div class="progress"><strong id="stepNum">1/18</strong><div class="track"><div class="bar" id="bar"></div></div></div>
    </header>
    <section class="layout">
      <section class="main">
        <section class="teacherCard">
          <span class="avatar">師</span>
          <div><p class="eyebrow">老師提示</p><h2 id="aiTitle"></h2><div id="aiText"></div></div>
          <div class="navBtns"><button class="secondary" onclick="go(-1)">上一步</button><button onclick="go(1)">下一步</button></div>
        </section>
        <section id="main"></section>
      </section>
      <aside class="preview" id="preview"></aside>
    </section>
  </main>
  <script>
    const stepNames=["開始活動","提出生活困擾","整理相近主題","選擇想分析的問題","界定主要問題","認識向右魚骨圖","提出可能原因","確認原因內容","原因分類與大要因命名","確認向右魚骨圖","建立決策目標","認識向左魚骨圖","提出解決方法","連結方法與原因","確認要放進魚骨圖的方法","成果整理","選擇方案","反思與完成"];
    const ai={1:["歡迎進入「魚骨洞天」。今天我們會先選一個生活中想分析的問題，再找原因，最後想方法。","請先選擇現在是你一個人操作，還是小組一起進行；如果是小組，也可以先建立組員代號或暱稱。"],2:["請先提出一個生活困擾，可以是人際、課業、家庭、校園或時間管理上的問題，不需要說出不想公開的私人細節。","如果是小組，可以由不同組員提出，也可以由代表輸入你們已經共同想到的一個困擾。"],3:["請看看這些困擾，有沒有幾張是在講相近的主題，可以先拖到同一組。","如果目前只有一張困擾，或已經選好想分析的問題，可以直接往下一步。"],4:["請從候選問題中選出目前想分析的一項。投票可以參考，但最後仍要確認這是不是目前決定要分析的問題。"],5:["如果提供的內容已經足夠，我會先整理成主要問題草稿，請確認有沒有改變原意。","如果資訊還不夠，請先補充：誰遇到、在什麼情境、實際困難是什麼。"],6:["向右魚骨圖是用來找原因。魚頭放主要問題，魚骨上整理大要因與具體原因。"],7:["請先提出一些可能原因，先求多樣，不急著判斷對不對。","如果想不到，可以換一個角度想：人、環境、時間、規則或工具，哪一邊可能有影響？"],8:["我會先幫每項內容做初步檢查，提醒它可能比較像原因、結果或方法；最後仍由你確認、補充或修正。"],9:["請把相近的原因拖到同一個大要因下面，再替這一類取一個能看出共同點的名稱。"],10:["這是目前的向右魚骨圖，請檢查主要問題、大要因和具體原因是否符合原本的想法。"],11:["你可以選填想優先處理的原因，幫助聚焦；下面的決策目標才是正式要寫的目標。","目標不一定要一次處理所有原因，但要清楚說出想改善什麼。"],12:["向左魚骨圖是用來找方法。魚頭放決策目標，魚骨上整理大方法與具體方法。"],13:["請提出可能的解決方法，再慢慢補得更具體。","如果方法像「更努力」這種口號，請補充：誰來做、什麼時候做、怎麼做。"],14:["請把每個想保留的方法拖到它主要回應的原因，並簡短說明它怎麼幫助達成目標。"],15:["只有已經完成原因對應，也能支持決策目標的方法，才可以確認放進魚骨圖。"],16:["這一步只確認成果內容：主要問題、原因分類、決策目標、方法和對應關係有沒有漏掉或放錯。先不用選最可行或最獨特方法。"],17:["請先從已放進魚骨圖的方法中選出最可行的方法並寫下理由，再選出最獨特的方法並寫下理由。","最可行和最獨特可以是同一個方法，也可以是不同方法。"],18:["最後請完成一題反思：魚骨圖如何幫助避免只處理表面問題？","完成後可以匯出圖片版與文字版成果。"]};
    const domains=["人際相處","學習課業","家庭生活","校園生活","時間管理"], colors=["#276EF1","#00A676","#D95D39","#7B61FF","#B7791F","#008C95"], risks=["自殺","自傷","傷害自己","不想活","傷人","殺人","暴力","性侵","性暴力","虐待","威脅","勒索","跟蹤","霸凌","不安全","家暴"];
    let S={step:1,mode:"unknown",sources:[{id:"s1",name:"組員 1",color:colors[0],system:false},{id:"s2",name:"組員 2",color:colors[1],system:false},{id:"s3",name:"組員 3",color:colors[2],system:false},{id:"group",name:"小組提出",color:"#46515f",system:true},{id:"unknown",name:"未指定",color:"#8a8f98",system:true}],active:"unknown",distresses:[],topics:[{id:"t1",name:"主題 A"},{id:"t2",name:"主題 B"}],selected:"",problem:"",problemOk:false,causes:[],cats:[{id:"c1",name:"大要因 1"},{id:"c2",name:"大要因 2"}],rightOk:false,goal:"",priority:[],stash:[],methods:[],formalOk:false,outcomeOk:false,feasible:"",feasibleReason:"",unique:"",uniqueReason:"",reflection:""};
    const $=id=>document.getElementById(id), uid=p=>p+"-"+Date.now()+"-"+Math.random().toString(16).slice(2), esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const src=id=>S.sources.find(s=>s.id===id)||S.sources.find(s=>s.id==="unknown"), badge=id=>`<span class="badge" style="border-color:${src(id).color};color:${src(id).color}">${esc(src(id).name)}</span>`;
    function risk(text,type){let hit=risks.find(r=>(text||"").includes(r));if(!hit)return false;$("safetyMeta").textContent=`紀錄：Step ${S.step}、內容類型「${type}」、高風險訊號類型「${hit}」、處理狀態「已暫停並提示轉介」。不保存完整敏感原文。`;$("afterHelp").classList.remove("show");$("safety").classList.add("show");return true}
    function ackSafety(){$("afterHelp").classList.add("show")} function resetAll(){location.reload()} function go(n){S.step=Math.max(1,Math.min(18,S.step+n));render()} function setStep(n){S.step=n;render()}
    function drag(e,type,id){e.dataTransfer.setData("text/plain",type+":"+id)} function drop(e,target,id){e.preventDefault();const [type,did]=e.dataTransfer.getData("text/plain").split(":"); if(target==="topic"&&type==="distress")S.distresses=S.distresses.map(x=>x.id===did?{...x,groupId:id}:x); if(target==="cat"&&type==="cause")S.causes=S.causes.map(x=>x.id===did?{...x,catId:id}:x); if(target==="connect"&&type==="method")S.methods=S.methods.map(m=>m.id===did&&!m.causes.includes(id)?{...m,causes:[...m.causes,id],status:m.effect?"候選方法":"需補充對應理由"}:m); render()}
    function addSource(){let n=S.sources.filter(x=>!x.system).length+1;S.sources.splice(S.sources.length-2,0,{id:uid("member"),name:"組員 "+n,color:colors[(n-1)%colors.length],system:false});render()} function delSource(id){S.sources=S.sources.filter(s=>s.id!==id);["distresses","causes","methods","stash"].forEach(k=>S[k].forEach(x=>{if(x.source===id)x.source="unknown"}));render()}
    function sourceSelect(value=S.active,code="S.active=this.value"){return `<select onchange="${code};render()">${S.sources.map(s=>`<option value="${s.id}" ${value===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`}
    function addSpoken(type){const text=$("newText").value.trim();if(!text||risk(text,type))return;if(type==="distress")S.distresses.push({id:uid("d"),text,domain:$("domain")?.value||domains[0],source:S.active,status:"可分析"});if(type==="cause")S.causes.push({id:uid("c"),text,source:S.active,status:"待確認",aiGuess:guessCause(text)});if(type==="method")S.methods.push({id:uid("m"),text,source:S.active,big:"",status:"方法草稿",causes:[],effect:""});render()}
    function guessCause(t){if(/[可要應該請讓用排訂建改增減提醒約定分工]/.test(t))return"像方法";if(/導致|造成|所以|結果|變成|被罵|吵架|壓力|失敗/.test(t))return"像結果";return"像原因"}
    function voiceTo(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="這個瀏覽器目前不支援語音辨識，請改用文字輸入。";return}const r=new SR();r.lang="zh-TW";r.interimResults=false;$("voiceStatus").textContent="正在聽，說完請稍等轉文字。";r.onresult=e=>{$(id).value=e.results[0][0].transcript;$("voiceStatus").textContent="已轉成文字，請確認後再送出。"};r.onerror=()=>{$("voiceStatus").textContent="語音辨識沒有成功，請再試一次或改用文字。"};r.start()}
    function render(){document.title="魚骨洞天";$("stepNum").textContent=S.step+"/18";$("bar").style.width=(S.step/18*100)+"%";$("aiTitle").textContent=stepNames[S.step-1];$("aiText").innerHTML=(ai[S.step]||[]).map(x=>`<p>${x}</p>`).join("");$("main").innerHTML=screen();$("preview").innerHTML=fish("right")+fish("left")}
    function panel(title,hint,body){return `<section class="panel"><div class="panelHead"><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:""}</div>${body}</section>`}
    function speakBox(kind,placeholder,buttonText,extra=""){return `<div class="speakBox"><label>目前發言者／來源</label>${sourceSelect()}<textarea id="newText" placeholder="${placeholder}"></textarea>${extra}<div class="speakControls"><button class="secondary" onclick="voiceTo('newText')">語音輸入</button><button onclick="addSpoken('${kind}')">${buttonText}</button></div><p class="voiceStatus" id="voiceStatus">語音輸入前，請先選目前發言者；轉成文字後仍需確認再送出。</p></div>`}
    function screen(){return [step1,step2,step3,step4,step5,step6,step7,step8,step9,step10,step11,step12,step13,step14,step15,step16,step17,step18][S.step-1]()}
    function step1(){return panel("開始魚骨洞天","先設定操作方式；小組可以保留組員代號，也可以改成暱稱。",`<div class="mode"><button class="${S.mode==="solo"?"selected":""}" onclick="S.mode='solo';render()">一個人操作</button><button class="${S.mode==="group"?"selected":""}" onclick="S.mode='group';render()">小組一起進行</button></div><h3>組員代號或暱稱</h3>${S.sources.filter(s=>!s.system).map(s=>`<label class="sourceEditor"><span class="dot" style="background:${s.color}"></span><input value="${esc(s.name)}" onchange="src('${s.id}').name=this.value;render()"><button class="secondary" onclick="delSource('${s.id}')">移除</button></label>`).join("")}<button class="secondary" onclick="addSource()">新增組員</button>`)}
    function step2(){return panel("提出生活困擾","學生任務是提出困擾；卡片只是幫你整理畫面。",speakBox("distress","說出或輸入一個生活中想分析的困擾", "確認提出困擾",`<select id="domain">${domains.map(d=>`<option>${d}</option>`).join("")}</select>`)+`<div class="cardGrid">${S.distresses.map(d=>distressCard(d)).join("")}</div>`)}
    function step3(){return panel("整理相近主題","拖曳困擾到相近主題；若只有一張或已選定問題，可略過。",addRow("新增主題","主題名稱","topic")+`<div class="columns"><div class="drop" ondragover="event.preventDefault()" ondrop="drop(event,'topic','')"><h3>尚未分群</h3>${S.distresses.filter(d=>!d.groupId).map(d=>mini("distress",d)).join("")}</div>${S.topics.map(t=>`<div class="drop" ondragover="event.preventDefault()" ondrop="drop(event,'topic','${t.id}')"><div class="row"><input value="${esc(t.name)}" onchange="S.topics.find(x=>x.id==='${t.id}').name=this.value;render()"><button class="secondary" onclick="S.topics=S.topics.filter(x=>x.id!=='${t.id}');S.distresses.forEach(d=>{if(d.groupId==='${t.id}')d.groupId=''});render()">刪除主題</button></div>${S.distresses.filter(d=>d.groupId===t.id).map(d=>mini("distress",d)).join("")}</div>`).join("")}</div>`)}
    function step4(){return panel("選擇想分析的問題","這裡只選擇或確認；如果要改寫，下一步再做。",S.distresses.map(d=>`<button class="choice ${S.selected===d.text?"selected":""}" onclick="S.selected=this.dataset.text;render()" data-text="${esc(d.text)}">${badge(d.source)}<span>${esc(d.text)}</span></button>`).join("")+`<button ${S.selected.trim()?"":"disabled"} onclick="setStep(5)">確認這是目前想分析的問題</button>`)}
    function step5(){return panel("界定主要問題","請確認主要問題是否包含對象、情境、實際困難。",`<p class="surface">選定內容：${esc(S.selected||"尚未選定")}</p><textarea id="problemText" placeholder="誰在什麼情境遇到什麼困難？">${esc(S.problem)}</textarea><div class="row stack"><button class="secondary" onclick="S.problem=S.selected;render()">依已選內容整理草稿</button><button onclick="S.problem=$('problemText').value;if(S.problem.trim())S.problemOk=true;render()">確認主要問題</button></div>${S.problemOk?'<p class="ok">主要問題已確認。</p>':''}`)}
    function intro(side){let isR=side==="right";return panel(isR?"認識向右魚骨圖":"認識向左魚骨圖",isR?"先分析原因，不急著想方法。":"根據決策目標來想方法。",`<div class="introDiagram"><div class="introStack"><div class="introBox"><strong>${isR?"大要因":"大方法"}</strong><p>${isR?"一類相近原因":"一類解決方向"}</p></div><div class="introBox"><strong>${isR?"具體原因":"具體方法"}</strong><p>${isR?"更細的情況、行為或條件":"實際可做的行動"}</p></div></div><div><div class="fishMiniHead">${isR?"魚頭：主要問題":"魚頭：決策目標"}</div><div class="fishLine"></div></div><div class="introBox"><strong>${isR?"魚骨上的內容都要回答：「為什麼？」":"魚骨上的內容都要回答：「可以怎麼做？」"}</strong><p>${isR?"每張原因卡之後會被整理到大要因下面。":"每張方法卡之後要連回原因，才可放進魚骨圖。"}</p></div></div>${fish(side)}`)}
    function step6(){return intro("right")} function step12(){return intro("left")+panel("方法暫存區","前面像方法的內容可在這裡取回，但仍要重新檢查。",`<div class="cardGrid">${S.stash.map(m=>`<article class="card"><p>${esc(m.text)}</p>${badge(m.source)}<button onclick="takeStash('${m.id}')">取回成方法草稿</button></article>`).join("")||'<p class="small">目前沒有方法暫存。</p>'}</div>`)}
    function step7(){return panel("提出可能原因","學生任務是提出原因；系統會用卡片整理。",speakBox("cause","說出或輸入一個可能原因", "確認提出原因")+`<div class="cardGrid">${S.causes.filter(c=>c.status!=="已移到方法暫存區").map(c=>causeCard(c,false)).join("")}</div>`)}
    function step8(){return panel("確認原因內容","AI 先做初步提示，請你確認、補充或修正。",`<div class="cardGrid">${S.causes.filter(c=>c.status!=="已移到方法暫存區").map(c=>causeCard(c,true)).join("")}</div><h3>方法暫存區</h3><div class="cardGrid">${S.stash.map(m=>`<article class="card"><p>${esc(m.text)}</p>${badge(m.source)}</article>`).join("")||'<p class="small">像方法的內容會先放在這裡，不會提前進入向左魚骨圖。</p>'}</div>`)}
    function step9(){return panel("原因分類與大要因命名","把相近原因拖到大要因下面；大要因名稱由學生輸入。",addRow("新增大要因","例如：分工溝通","cat")+`<div class="columns"><div class="drop" ondragover="event.preventDefault()" ondrop="drop(event,'cat','')"><h3>尚未分類原因</h3>${S.causes.filter(c=>!c.catId&&c.status!=="已移到方法暫存區").map(c=>mini("cause",c)).join("")}</div>${S.cats.map(cat=>`<div class="drop" ondragover="event.preventDefault()" ondrop="drop(event,'cat','${cat.id}')"><div class="row"><input value="${esc(cat.name)}" onchange="S.cats.find(x=>x.id==='${cat.id}').name=this.value;render()"><button class="secondary" onclick="S.cats=S.cats.filter(x=>x.id!=='${cat.id}');S.causes.forEach(c=>{if(c.catId==='${cat.id}')c.catId=''});render()">刪除</button></div>${S.causes.filter(c=>c.catId===cat.id).map(c=>mini("cause",c)).join("")}</div>`).join("")}</div>`)}
    function step10(){return panel("確認向右魚骨圖","確認後再進入決策目標。",fish("right")+`<div class="row stack"><button onclick="S.rightOk=true;render()">可繼續</button><button class="secondary" onclick="setStep(9)">需要修改</button></div>${S.rightOk?'<p class="ok">向右魚骨圖已確認。</p>':''}`)}
    function step11(){let cs=S.causes.filter(c=>c.status!=="暫不使用"&&c.status!=="已移到方法暫存區");return panel("建立決策目標","上方可選填優先處理原因；下方才是正式決策目標。",`<h3>選填：優先處理原因</h3><div class="chips">${cs.map(c=>`<label class="chip"><input type="checkbox" ${S.priority.includes(c.id)?"checked":""} onchange="togglePriority('${c.id}',this.checked)">${esc(c.text)}</label>`).join("")||'<p class="small">先完成原因分析後，這裡會出現可選原因。</p>'}</div><h3>正式輸入：決策目標</h3><textarea id="goalText" placeholder="請寫下想改善的情況，也就是決策目標。">${esc(S.goal)}</textarea><button onclick="S.goal=$('goalText').value;render()">確認決策目標</button>`)}
    function step13(){return panel("提出解決方法","學生任務是提出方法；方法還不是正式成果。",speakBox("method","說出或輸入一個可能方法", "確認提出方法")+methodBoard(S.methods))}
    function step14(){return panel("連結方法與原因","拖曳方法到原因框，形成可視化對應；下拉只是備援。",`<div class="columns two"><div><h3>方法</h3>${methodBoard(S.methods.filter(m=>m.status!=="正式方法"),true)}</div><div><h3>原因對應區</h3>${S.causes.filter(c=>c.status!=="暫不使用"&&c.status!=="已移到方法暫存區").map(c=>`<div class="connectDrop" ondragover="event.preventDefault()" ondrop="drop(event,'connect','${c.id}')"><strong>${esc(c.text)}</strong><p class="small">把方法拖到這裡</p><div class="links">${S.methods.filter(m=>m.causes.includes(c.id)).map(m=>`<span>${esc(m.text)}</span>`).join("")}</div></div>`).join("")}</div></div>`)}
    function step15(){return panel("確認要放進魚骨圖的方法","先處理待確認方法；通過原因對應與作用說明後，才可放進魚骨圖。",`<div class="columns two"><div><h3>待確認方法</h3>${S.methods.filter(m=>m.status!=="正式方法").map(m=>{let pass=m.causes.length&&m.effect.trim();return `<article class="card ${pass?'':'needs'}"><p>${esc(m.text)}</p><p class="small">對應原因：${m.causes.length}；作用說明：${m.effect.trim()?"已填":"未填"}</p><button ${pass?"":"disabled"} onclick="formal('${m.id}')">放進魚骨圖</button>${pass?"":'<p class="warn">請先完成 Step 14 的原因對應與作用說明。</p>'}</article>`}).join("")}</div><div><h3>已放進魚骨圖的方法</h3>${S.methods.filter(m=>m.status==="正式方法").map(m=>`<article class="card formal"><p>${esc(m.text)}</p>${badge(m.source)}</article>`).join("")||'<p class="small">尚未確認方法。</p>'}<button ${S.methods.some(m=>m.status==="正式方法")?"":"disabled"} onclick="S.formalOk=true;render()">確認這些方法</button></div></div>`)}
    function step16(){return panel("成果整理","先看完整雙向魚骨圖，再確認文字整理。",`<div class="columns two"><div>${fish("right")}</div><div>${fish("left")}</div></div><pre class="outcome">${esc(outcome())}</pre><div class="row stack"><button onclick="S.outcomeOk=true;render()">成果內容正確</button><button class="secondary" onclick="setStep(10)">返回修改</button></div>`)}
    function step17(){let options=S.methods.filter(m=>m.status==="正式方法").map(m=>`<option value="${m.id}" ${S.feasible===m.id?"selected":""}>${esc(m.text)}</option>`).join("");let options2=S.methods.filter(m=>m.status==="正式方法").map(m=>`<option value="${m.id}" ${S.unique===m.id?"selected":""}>${esc(m.text)}</option>`).join("");return panel("選擇方案","只能從已放進魚骨圖的方法中選；兩者可以相同也可以不同。",`<label>最可行方法</label><select onchange="S.feasible=this.value"><option value="">請選擇</option>${options}</select><textarea onchange="S.feasibleReason=this.value" placeholder="為什麼這個方法最可行？">${esc(S.feasibleReason)}</textarea><label>最獨特方法</label><select onchange="S.unique=this.value"><option value="">請選擇</option>${options2}</select><textarea onchange="S.uniqueReason=this.value" placeholder="為什麼這個方法最獨特？">${esc(S.uniqueReason)}</textarea>`)}
    function step18(){return panel("反思與完成","圖片版成果包含完整雙向魚骨圖、方案選擇與反思。",`<textarea onchange="S.reflection=this.value" placeholder="魚骨圖如何幫助避免只處理表面問題？">${esc(S.reflection)}</textarea><pre class="outcome">${esc(outcome())}</pre><div class="row stack"><button onclick="exportImg()">匯出圖片版 SVG</button><button class="secondary" onclick="exportText()">匯出文字版</button></div>`)}
    function addRow(label,ph,type){return `<div class="add"><input id="add-${type}" placeholder="${ph}"><button onclick="addGroup('${type}')">${label}</button></div>`} function addGroup(type){let v=$("add-"+type).value.trim();if(!v)return;if(type==="topic")S.topics.push({id:uid("t"),name:v});if(type==="cat")S.cats.push({id:uid("cat"),name:v});render()}
    function distressCard(d){return `<article class="card" draggable="true" ondragstart="drag(event,'distress','${d.id}')"><textarea onchange="editDistress('${d.id}',this.value)">${esc(d.text)}</textarea><div class="meta">${badge(d.source)}<span>${esc(d.domain)}</span></div><button class="secondary" onclick="removeDistress('${d.id}')">刪除</button></article>`}
    function causeCard(c,check){let suggestion=c.aiGuess||guessCause(c.text);return `<article class="card" draggable="true" ondragstart="drag(event,'cause','${c.id}')"><textarea onchange="editCause('${c.id}','text',this.value)">${esc(c.text)}</textarea><div class="meta">${badge(c.source)}${check?`<span>AI 初步提示：${suggestion}</span>`:""}</div>${check?`<div class="row wrap"><button onclick="editCause('${c.id}','status','已確認為原因')">確認為原因</button><button class="secondary" onclick="editCause('${c.id}','status','需釐清因果關係')">補充說明</button><button class="secondary" onclick="editCause('${c.id}','status','像結果待確認')">保留但標示像結果</button><button class="secondary" onclick="moveToStash('${c.id}')">移到方法暫存區</button><button class="secondary" onclick="editCause('${c.id}','status','暫不使用')">暫不使用</button></div>`:""}<button class="secondary" onclick="removeCause('${c.id}')">刪除</button></article>`}
    function mini(type,x){return `<article class="mini" draggable="true" ondragstart="drag(event,'${type}','${x.id}')"><p>${esc(x.text)}</p>${badge(x.source)}</article>`}
    function editDistress(id,val){let d=S.distresses.find(x=>x.id===id);if(d)d.text=val;render()} function removeDistress(id){if(confirm("刪除此困擾？")){S.distresses=S.distresses.filter(x=>x.id!==id);render()}} function editCause(id,k,v){let c=S.causes.find(x=>x.id===id);if(c){c[k]=v;if(k==="text")c.aiGuess=guessCause(v)}render()} function removeCause(id){if(confirm("刪除此原因？")){S.causes=S.causes.filter(x=>x.id!==id);S.methods.forEach(m=>m.causes=m.causes.filter(c=>c!==id));render()}}
    function moveToStash(cid){let c=S.causes.find(x=>x.id===cid);if(!c)return;S.stash.push({id:uid("stash"),text:c.text,source:c.source,from:cid});c.status="已移到方法暫存區";render()} function takeStash(mid){let m=S.stash.find(x=>x.id===mid);if(!m)return;S.methods.push({id:uid("m"),text:m.text,source:m.source,big:"",status:"方法草稿",causes:[],effect:""});S.stash=S.stash.filter(x=>x.id!==mid);render()}
    function methodBoard(list,draggable=false){return `<div class="cardGrid">${list.map(m=>`<article class="card methodCard" ${draggable?`draggable="true" ondragstart="drag(event,'method','${m.id}')"`:""}><textarea oninput="methodEditSoft('${m.id}','text',this.value)">${esc(m.text)}</textarea><input placeholder="大方法名稱，由學生輸入" value="${esc(m.big)}" oninput="methodEditSoft('${m.id}','big',this.value)"><p class="small">目前狀態：${esc(m.status)}</p><select onchange="addCauseLink('${m.id}',this.value);this.value=''"><option value="">備援：選擇對應原因</option>${S.causes.filter(c=>c.status!=="暫不使用"&&c.status!=="已移到方法暫存區").map(c=>`<option value="${c.id}">${esc(c.text)}</option>`).join("")}</select><textarea placeholder="它如何支持決策目標？" oninput="methodEditSoft('${m.id}','effect',this.value)">${esc(m.effect)}</textarea><div class="meta">${badge(m.source)}<span>${m.causes.length} 個對應原因</span></div><button class="secondary" onclick="S.methods=S.methods.filter(x=>x.id!=='${m.id}');render()">刪除</button></article>`).join("")}</div>`}
    function methodEditSoft(id,k,v){let m=S.methods.find(x=>x.id===id);if(m)m[k]=v} function addCauseLink(mid,cid){if(!cid)return;let m=S.methods.find(x=>x.id===mid);if(m&&!m.causes.includes(cid))m.causes.push(cid);render()} function formal(id){let m=S.methods.find(x=>x.id===id);if(m)m.status="正式方法";render()} function togglePriority(id,on){S.priority=on?[...S.priority,id]:S.priority.filter(x=>x!==id);render()}
    function fish(side){if(side==="right")return `<section class="fish"><div class="head"><span>魚頭：主要問題</span><strong>${esc(S.problem||S.selected||"尚未填寫")}</strong></div><div class="bones">${S.cats.map(cat=>`<div class="bone"><h3>${esc(cat.name)}</h3>${S.causes.filter(c=>c.catId===cat.id&&c.status!=="暫不使用"&&c.status!=="已移到方法暫存區").map(c=>`<p>${esc(c.text)} ${badge(c.source)}</p>`).join("")||'<p class="small">尚未放入原因</p>'}</div>`).join("")}</div></section>`;let groups={};S.methods.filter(m=>m.status==="正式方法").forEach(m=>{let k=m.big.trim()||"未命名大方法";(groups[k]||(groups[k]=[])).push(m)});return `<section class="fish"><div class="head"><span>魚頭：決策目標</span><strong>${esc(S.goal||"尚未建立")}</strong></div><div class="bones">${Object.keys(groups).map(k=>`<div class="bone"><h3>${esc(k)}</h3>${groups[k].map(m=>`<p>${esc(m.text)}</p>`).join("")}</div>`).join("")||'<div class="bone"><h3>方法</h3><p class="small">尚未放入方法</p></div>'}</div></section>`}
    function outcome(){let cats=S.cats.map(cat=>{let items=S.causes.filter(c=>c.catId===cat.id&&c.status!=="暫不使用"&&c.status!=="已移到方法暫存區");return items.length?`- ${cat.name}\n${items.map(c=>"  - "+c.text).join("\n")}`:""}).filter(Boolean).join("\n");let methods=S.methods.filter(m=>m.status==="正式方法").map(m=>{let linked=m.causes.map(id=>(S.causes.find(c=>c.id===id)||{}).text).filter(Boolean).join("、");return `- ${m.big||"未命名大方法"}\n  - ${m.text}——對應：${linked||"尚未標示"}；作用：${m.effect||"尚未說明"}`}).join("\n");let fm=(S.methods.find(m=>m.id===S.feasible)||{}).text||"",um=(S.methods.find(m=>m.id===S.unique)||{}).text||"";return `【魚骨洞天成果】\n主要問題：${S.problem||S.selected||"尚未確認"}\n\n【向右魚骨圖：找原因】\n${cats||"尚未整理大要因"}\n\n決策目標：${S.goal||"尚未建立"}\n\n【向左魚骨圖：找方法】\n${methods||"尚未建立正式方法"}\n\n最可行方法：${fm||"尚未選擇"}\n理由：${S.feasibleReason||"尚未填寫"}\n最獨特方法：${um||"尚未選擇"}\n理由：${S.uniqueReason||"尚未填寫"}\n\n反思：${S.reflection||"尚未填寫"}`}
    function exportText(){dl("魚骨洞天成果.txt",outcome(),"text/plain;charset=utf-8")} function exportImg(){let lines=outcome().split("\n"),h=Math.max(760,80+lines.length*24),body=lines.map((l,i)=>`<text x="48" y="${64+i*24}" font-size="${l.startsWith("【")?21:16}" font-weight="${l.startsWith("【")?700:400}" fill="#172033">${esc(l)}</text>`).join("");dl("魚骨洞天成果.svg",`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="${h}" viewBox="0 0 1200 ${h}"><rect width="1200" height="${h}" fill="#fbfaf7"/><rect x="24" y="24" width="1152" height="${h-48}" rx="16" fill="#fff" stroke="#ccd6e0"/>${body}</svg>`,"image/svg+xml;charset=utf-8")}
    function dl(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
    render();
  </script>
</body>
</html>
