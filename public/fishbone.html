<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>魚骨洞天</title>
  <link rel="stylesheet" href="fishbone-base.css" />
  <link rel="stylesheet" href="fishbone-layout.css" />
  <link rel="stylesheet" href="fishbone-diagrams.css" />
  <link rel="stylesheet" href="fishbone-activity.css" />
</head>
<body>
  <div class="safety" id="safety">
    <section class="safetyPanel">
      <p class="eyebrow">活動已暫停</p>
      <h2>這個內容可能涉及安全或需要成人協助</h2>
      <p>請立刻找現場老師或可信任成人協助。我們不會把這個內容當作魚骨圖練習素材，也不會繼續追問細節。</p>
      <button onclick="ackSafety()">我已找老師或可信任成人協助</button>
      <div class="afterHelp" id="afterHelp">
        <p class="small">如果老師或可信任成人已協助處理，而且你想繼續活動，請另開一個新的、安全的一般生活困擾。</p>
        <button class="secondary" onclick="resetAll()">重新開始一個安全題目</button>
      </div>
      <p class="small" id="safetyMeta"></p>
    </section>
  </div>

  <main class="app">
    <header class="top">
      <div><p class="eyebrow">創意萬事通</p><h1>魚骨洞天</h1></div>
      <div class="progress"><strong id="stepNum"></strong><div class="track"><div class="bar" id="bar"></div></div></div>
    </header>
    <section class="layout">
      <section>
        <section class="teacher" id="teacherPanel">
          <span class="avatar">師</span>
          <div><p class="eyebrow">老師提示</p><h2 id="aiTitle"></h2><div id="aiText"></div><div class="teacherTools"><button class="secondary" onclick="speakTeacher(false)">重播提示</button><button class="secondary" id="ttsToggle" onclick="toggleAutoTts()"></button></div><div id="ttsStatus" class="small"></div><div id="agentHint"></div><div id="gateMsg"></div></div>
          <div class="nav"><button class="secondary" id="prevBtn" onclick="previousStep()">上一步</button><button id="nextBtn" onclick="nextStep()">下一步</button></div>
        </section>
        <section id="main"></section>
      </section>
      <aside class="preview" id="preview"></aside>
    </section>
  </main>

  <script src="fishbone-foundation.js"></script>
  <script src="fishbone-room-state.js"></script>
  <script src="fishbone-sync-client.js"></script>
  <script src="fishbone-sync-loop.js"></script>
  <script src="fishbone-activity-rules.js"></script>
  <script src="fishbone-outcomes.js"></script>
  <script src="fishbone-progression.js"></script>
  <script src="fishbone-collaboration.js"></script>
  <script src="fishbone-grouping.js"></script>
  <script src="fishbone-problem-goal.js"></script>
  <script src="fishbone-runtime.js"></script>
  <script src="fishbone-steps-start.js"></script>
  <script src="fishbone-steps-analysis.js"></script>
  <script src="fishbone-steps-solution.js"></script>
  <script src="fishbone-cards.js"></script>
  <script src="fishbone-methods.js"></script>
  <script src="fishbone-diagram-data.js"></script>
  <script src="fishbone-svg.js"></script>
  <script src="fishbone-revision.js"></script>
  <script src="fishbone-bootstrap.js"></script>
</body>
</html>
