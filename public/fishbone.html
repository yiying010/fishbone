    function classifyCause(t){t=(t||"").trim();let method=/設定|使用|運用|安排|建立|提醒|約定|分工|改善|增加|減少|解決|處理|規劃|檢查|記錄|溝通|練習|請教|找老師|找同學|列清單|清單|番茄鐘|固定讀書|每天固定|提早|制定|執行/.test(t),result=/無法|不能|沒辦法|來不及|遲交|晚交|沒交|作業無法|無法準時|成績下降|退步|壓力變大|焦慮|被罵|被扣分|失敗|沒完成|結果|造成|導致/.test(t),cause=/因為|忘記|不知道|不會|缺乏|沒有|太多|太少|時間不夠|容易分心|聽不懂|看不懂|沒規劃|拖延|懶得|睡眠不足|環境吵|資料不足/.test(t);if(t.length<5)return {kind:"需要釐清",reason:"這張卡的內容還太短，請補充它和主要問題的關係。"};if(method&&!cause)return {kind:"比較像方法",reason:"這看起來比較像可以怎麼做，是否先留到方法階段？"};if(result&&!cause)return {kind:"比較像結果",reason:"這比較像問題造成的後果或表現。它能不能回答為什麼會發生主要問題？"};if(cause)return {kind:"比較像原因",reason:"它看起來能回答為什麼會發生主要問題，請你確認。"};return {kind:"需要釐清",reason:"這張卡和主要問題的因果關係還不夠清楚，請說明它為什麼會造成主要問題。"}}

    let recognition=null,voiceBusy=false,voiceTargetId="",voiceStartedOnce=false;function isFileMode(){return location.protocol==="file:"}function voiceHelp(needsSpeaker=false){let base=needsSpeaker?`語音轉文字後，會以「${src(actor()).name}」送出；請確認內容再送出。`:"語音轉文字後，請確認內容再送出。";return isFileMode()?base+" 目前是 file:// 離線測試，Chrome 可能每次錄音都重新詢問麥克風權限；若出現此情況，請以文字輸入為主，STT 改到 localhost 或 HTTPS 測試。":base}function setVoiceStatus(msg){let el=$("voiceStatus");if(el)el.textContent=msg}function initVoice(){if(recognition)return recognition;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;recognition=new SR();recognition.lang="zh-TW";recognition.interimResults=false;recognition.continuous=false;recognition.onresult=e=>{let target=$(voiceTargetId);if(target){target.value=e.results[0][0].transcript;target.dispatchEvent(new Event("input",{bubbles:true}));target.dispatchEvent(new Event("change",{bubbles:true}))}setVoiceStatus("已轉成文字，請確認內容後再送出。")};recognition.onerror=()=>{voiceBusy=false;S.recordingBy="";setVoiceStatus(isFileMode()?"語音辨識沒有成功。你目前用 file:// 離線測試，若 Chrome 反覆要求權限，請先改用文字輸入，STT 留到 localhost 或 HTTPS 測試。":"語音辨識沒有成功，請再試一次或改用文字。")};recognition.onend=()=>{voiceBusy=false;S.recordingBy="";setVoiceStatus("已結束聆聽，請確認文字後再送出。")};return recognition}function startVoice(id){if(id==="newText"&&!hasSpeaker()){remindSpeaker();return}let target=$(id);if(!target)return;let rec=initVoice();if(!rec){setVoiceStatus("這個瀏覽器目前不支援語音辨識，請改用文字輸入。");return}if(voiceBusy){setVoiceStatus("目前正在聽，請先說完這一段。");return}voiceTargetId=id;voiceBusy=true;voiceStartedOnce=true;S.recordingBy=actor();setVoiceStatus(isFileMode()?"正在聽，說完請稍等轉文字。提醒：file:// 離線模式下，Chrome 可能每次錄音都要求麥克風權限。":"正在聽，說完請稍等轉文字。");render();try{rec.start()}catch(e){voiceBusy=false;S.recordingBy="";setVoiceStatus("語音輸入尚未結束，請稍後再試。")}}

    function outcomeCore(){let cats=S.cats.map(cat=>{let items=usableCauses().filter(c=>c.catId===cat.id);return items.length?`- ${cat.name}\n${items.map(c=>"  - "+c.text).join("\n")}`:""}).filter(Boolean).join("\n");let methods=formalMethods().map(m=>{let linked=m.causes.map(id=>(S.causes.find(c=>c.id===id)||{}).text).filter(Boolean).join("、");return `- ${m.big}\n  - ${m.text}——對應：${linked||"尚未標示"}；作用：${m.effect||"尚未說明"}`}).join("\n");return `【魚骨洞天成果整理】\n主要問題：${S.problem||S.selected||"尚未確認"}\n\n【向右魚骨圖：找原因】\n${cats||"尚未整理大要因"}\n\n決策目標：${S.goal||"尚未建立"}\n\n【向左魚骨圖：找方法】\n${methods||"尚未建立正式方法"}`}
    function outcomeFull(){let fm=solutionResultText("feasible"),um=solutionResultText("unique"),refs=S.reflections.map(r=>`${src(r.source||r.createdBy).name}：${r.text}`).join("\n"),pending=S.methods.filter(m=>m.status==="暫不納入").map(m=>"- "+m.text).join("\n");return `${outcomeCore()}\n\n最可行方法：${fm}\n理由：${S.feasibleReason||""}\n最獨特方法：${um}\n理由：${S.uniqueReason||""}\n\n小組反思摘要：${S.reflectionSummary||""}\n\n【各成員個人反思】\n${refs}\n\n【未納入項目】\n${pending}`}
    function selectionBlock(){let fm=solutionResultText("feasible"),um=solutionResultText("unique");return `<section class="summaryBlock"><h3>方案選擇</h3><p><strong>最可行方法：</strong>${esc(fm)}</p><p><strong>理由：</strong>${esc(S.feasibleReason||"")}</p><p><strong>最獨特方法：</strong>${esc(um)}</p><p><strong>理由：</strong>${esc(S.uniqueReason||"")}</p></section>`}
    function reflectionBlock(){return `<section class="summaryBlock"><h3>小組反思摘要</h3><p>${esc(S.reflectionSummary||"")}</p></section>`}
    function exportText(){let name="魚骨洞天成果.txt",body=outcomeFull();dl(name,body,"text/plain;charset=utf-8");saveArtifact("text",name,body)}
    function exportFishboneSvg(data={}){let w=1800,h=1120,fish=`<g transform="translate(50 86) scale(1.4167)">${doubleCore({title:"雙向魚骨圖成果"})}</g>`,summaryY=845,fm=solutionResultText("feasible"),um=solutionResultText("unique");return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fishSvgDefs()}<rect width="${w}" height="${h}" fill="#fbfaf7"/><text x="50" y="52" font-size="30" font-weight="800" fill="#172033">魚骨洞天最終成果</text>${fish}<rect x="50" y="${summaryY}" width="820" height="220" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="78" y="${summaryY+38}" font-size="22" font-weight="800" fill="#172033">方案選擇</text>${svgTextBlock("最可行方法："+fm,78,summaryY+72,{size:16,weight:700,max:38,lines:2,gap:20})}${svgTextBlock("理由："+(S.feasibleReason||""),78,summaryY+124,{size:15,max:42,lines:2,gap:19})}${svgTextBlock("最獨特方法："+um,78,summaryY+174,{size:16,weight:700,max:38,lines:1,gap:20})}${svgTextBlock("理由："+(S.uniqueReason||""),78,summaryY+202,{size:15,max:42,lines:1,gap:19})}<rect x="930" y="${summaryY}" width="820" height="220" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="958" y="${summaryY+38}" font-size="22" font-weight="800" fill="#172033">小組反思摘要</text>${svgTextBlock(S.reflectionSummary||"",958,summaryY+76,{size:16,max:50,lines:6,gap:22})}</svg>`}
    function exportImg(){let name="魚骨洞天成果.svg",body=exportFishboneSvg();dl(name,body,"image/svg+xml;charset=utf-8");saveArtifact("svg",name,body)}
    function dl(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000)}
    document.addEventListener("pointerdown",markInteraction,{once:true});
    document.addEventListener("keydown",markInteraction,{once:true});
    render();
  </script>
</body>
